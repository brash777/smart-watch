org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Product name shown on the watch (the same value as APP_NAME / VITE_APP_NAME).
snapia.appName=Snapia
# Snapia API as the watch sees it. On the emulator, `adb reverse tcp:4000 tcp:4000` and
# `adb reverse tcp:9000 tcp:9000` (photos in MinIO) make this Mac reachable at localhost.
# Override it with -Psnapia.apiUrl=… or in ~/.gradle/gradle.properties.
snapia.apiUrl=http://localhost:4000/api
